name: ARM64 macOS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Unit tests
        run: swift test
      - name: Build SSH authentication helper
        run: swift build -c release --product SSHAskPass
      - name: SSH and SFTP integration
        run: bash scripts/ssh-integration.sh
      - name: Package
        if: github.event_name != 'pull_request'
        run: bash scripts/package.sh
      - name: Verify packaged app launch
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-package.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: MacTerm-arm64
          path: |
            dist/MacTerm.dmg
            dist/MacTerm.app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Package-resolved
          path: Package.resolved
          if-no-files-found: error
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provision OpenSSH if needed
        run: |
          if [[ ! -x /usr/sbin/sshd ]]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
      - name: Exercise Linux SSH PTY, collector and Docker service
        run: bash scripts/linux-integration.sh
  container-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise nerdctl and Kubernetes
        run: bash scripts/container-integration.sh
